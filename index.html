<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Мой ритм</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#F9F7FC;
    --card:#FFFFFF;
    --ink:#2E2838;
    --ink-soft:#948CA6;
    --accent:#7E6BB0;
    --accent-soft:#EBE4F6;
    --accent-tint:#F4F0FA;
    --line:#EBE6F3;
    --shadow:0 10px 28px rgba(70,55,110,.07);
    --r-card:26px;
    --r-row:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;line-height:1.4;
    padding:18px 16px calc(36px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;
  }

  /* шапка */
  .head{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow)}
  .avatar{width:58px;height:58px;flex:0 0 58px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:600;color:var(--accent);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .head-text{flex:1;min-width:0}
  .head-hi{font-size:13px;color:var(--ink-soft)}
  .head-name{font-size:20px;font-weight:650;letter-spacing:-.2px;margin-top:1px}
  .head-date{color:var(--ink-soft);font-size:13px;margin-top:2px}
  .ring{position:relative;width:58px;height:58px;flex:0 0 58px}
  .ring svg{transform:rotate(-90deg)}
  .ring-track{stroke:var(--accent-soft)}
  .ring-fill{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
  .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:650;color:var(--accent)}

  /* фраза дня */
  .phrase{margin-top:14px;padding:20px 22px;background:var(--accent-soft);border-radius:var(--r-card);font-size:16.5px;line-height:1.5}
  .phrase.pic{
    position:relative;overflow:hidden;
    min-height:170px;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:26px 24px;
    background:center 60%/cover no-repeat;box-shadow:var(--shadow);
  }
  .phrase.pic::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 50% 50%,rgba(255,255,255,.72) 0%,rgba(255,255,255,.48) 55%,rgba(255,255,255,.26) 100%);
  }
  .phrase.pic span{position:relative;font-weight:650;max-width:22ch;text-shadow:0 1px 10px rgba(255,255,255,.9),0 1px 2px rgba(255,255,255,.9)}

  /* неделя */
  .week{display:flex;justify-content:space-between;gap:6px;margin-top:14px;padding:14px 12px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow)}
  .day{flex:1;text-align:center}
  .day-label{font-size:11px;color:var(--ink-soft);margin-bottom:6px}
  .dot{width:30px;height:30px;margin:0 auto;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-soft);background:linear-gradient(var(--accent-soft),var(--accent-soft)) bottom/100% var(--fill,0%) no-repeat;transition:background-size .4s ease}
  .day.today .dot{border-color:var(--accent);color:var(--accent);font-weight:650}
  .dot.filled{border-color:var(--accent)}
  .dot.full{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}

  /* блоки */
  .block{margin-top:14px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
  .block.done{box-shadow:0 0 0 1.5px var(--accent-soft),var(--shadow)}
  .block-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:17px 18px 11px}
  .block-title{font-size:17px;font-weight:650;letter-spacing:-.2px}
  .block-icon{margin-right:7px}
  .block-time{font-size:12.5px;color:var(--ink-soft);margin-left:8px;font-weight:500}
  .block-count{font-size:13px;color:var(--ink-soft);white-space:nowrap}
  .block-count.note{color:var(--accent);font-weight:600;animation:rise .35s ease}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .bar{height:5px;margin:0 18px 12px;border-radius:99px;background:var(--accent-tint);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .45s ease}
  .block-empty{padding:0 18px 18px;color:var(--ink-soft);font-size:14.5px}

  /* дело */
  .row{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:0 10px 6px;border-radius:var(--r-row);cursor:pointer;background:transparent;transition:background .25s ease}
  .row:active{background:var(--accent-tint)}
  .row.done{background:var(--accent-tint)}
  .row.open{background:var(--accent-tint);margin-bottom:0}
  .icon{width:40px;height:40px;flex:0 0 40px;border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:19px;transition:background .25s ease}
  .row.done .icon,.row.open .icon{background:var(--card)}
  .row-text{flex:1;min-width:0}
  .row-title{font-size:15.5px;transition:color .25s ease}
  .row.done .row-title{color:var(--ink-soft)}
  .row-note{font-size:13px;color:var(--ink-soft);margin-top:1px}
  .subcount{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
  .chev{color:var(--ink-soft);font-size:15px;transition:transform .25s ease;width:14px;text-align:center}
  .row.open .chev{transform:rotate(90deg);color:var(--accent)}
  .box{width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;transition:background .2s ease,border-color .2s ease}
  .box::after{content:"";width:5px;height:9px;margin-top:-2px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(.5);opacity:0;transition:opacity .2s ease,transform .2s ease}
  .row.done .box{background:var(--accent);border-color:var(--accent)}
  .row.done .box::after{opacity:1;transform:rotate(45deg) scale(1)}

  /* подзадачи */
  .subs{margin:0 10px 8px;padding:2px 12px 10px 64px;background:var(--accent-tint);border-radius:0 0 var(--r-row) var(--r-row)}
  .sub{display:flex;align-items:center;gap:11px;padding:7px 0;cursor:pointer}
  .sbox{width:21px;height:21px;flex:0 0 21px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;transition:background .2s ease,border-color .2s ease}
  .sbox::after{content:"";width:4px;height:8px;margin-top:-2px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(.5);opacity:0;transition:opacity .2s ease,transform .2s ease}
  .sub.done .sbox{background:var(--accent);border-color:var(--accent)}
  .sub.done .sbox::after{opacity:1;transform:rotate(45deg) scale(1)}
  .sub-title{flex:1;min-width:0;font-size:14.5px}
  .sub.done .sub-title{color:var(--ink-soft);text-decoration:line-through}
  .subadd{display:flex;align-items:center;gap:11px;padding:8px 0 2px;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer}
  .subadd .plus{width:21px;flex:0 0 21px;text-align:center;font-size:18px;font-weight:400}
  .addform{display:flex;gap:8px;padding:6px 0 2px}
  .addform input{flex:1;min-width:0;font:inherit;font-size:14.5px;padding:10px 13px;border:1.5px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);outline:none}
  .addform input:focus{border-color:var(--accent)}
  .addform button{font:inherit;font-weight:600;font-size:14.5px;color:#fff;background:var(--accent);border:0;border-radius:13px;padding:0 16px;cursor:pointer}
  .del{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:19px;line-height:1}
  .del:active{background:var(--accent-soft)}

  .skipped{padding:0 18px 14px;font-size:13px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .skipped .chip{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--accent-tint);color:var(--accent);
    padding:5px 11px;border-radius:999px;font-weight:600;cursor:pointer;
  }

  /* добавить дело в блок */
  .add{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:0 10px 14px;border-radius:var(--r-row);cursor:pointer;color:var(--accent);font-weight:600;font-size:15px;transition:background .2s ease}
  .add:active{background:var(--accent-tint)}
  .add .icon{background:var(--accent-tint);color:var(--accent);font-size:22px;font-weight:400}
  .block .addform.main{margin:0 10px 14px}

  .badge{display:inline-flex;align-items:center;white-space:nowrap;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
  .foot{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:22px}
  .foot.full{color:var(--accent);font-weight:600}

  .stub{margin-top:60px;text-align:center;padding:0 24px}
  .stub h2{font-size:19px;font-weight:650;margin:0 0 8px}
  .stub p{color:var(--ink-soft);font-size:14.5px;margin:0 0 18px}
  .stub button{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:13px 26px;cursor:pointer}
  .skeleton{opacity:.5}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<div id="app" class="skeleton"></div>

<script>
(function(){
  "use strict";

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
  function tap(){ try{ tg.HapticFeedback.impactOccurred("light"); }catch(e){} }

  /* ── хранилища ── */
  var KEY  = "moy-ritm.v1";         // галочки
  var CKEY = "moy-ritm.custom.v1";  // свои дела дня
  var SKEY = "moy-ritm.subs.v1";    // подзадачи
  var RKEY = "moy-ritm.routine.v1"; // свои постоянные дела
  var PKEY = "moy-ritm.skip.v1";    // пропущенные на день
  var state = {}, custom = {}, subs = {}, routine = {}, skip = {};
  function read(k, def){ try { return JSON.parse(localStorage.getItem(k)) || def; } catch(e){ return def; } }
  function write(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  function loadAll(){ state = read(KEY,{}); custom = read(CKEY,{}); subs = read(SKEY,{}); routine = read(RKEY,{}); skip = read(PKEY,{}); }

  function key(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  var today = new Date();
  var todayKey = key(today);
  var WD = ["вс","пн","вт","ср","чт","пт","сб"];

  var open = {};       // раскрытые дела
  var addingFor = "";  // где открыта форма ввода

  function done(dk, id){ return !!(state[dk] && state[dk][id]); }
  function setDone(id, v){
    if(!state[todayKey]) state[todayKey] = {};
    if (v) state[todayKey][id] = 1; else delete state[todayKey][id];
    write(KEY, state);
  }
  function toggle(id){ setDone(id, !done(todayKey, id)); }

  function subsOf(dk, pid){ return (subs[dk] && subs[dk][pid]) || []; }
  function addSub(pid, title){
    title = (title||"").trim(); if(!title) return;
    if(!subs[todayKey]) subs[todayKey] = {};
    if(!subs[todayKey][pid]) subs[todayKey][pid] = [];
    subs[todayKey][pid].push({ id:"s"+Date.now(), title:title });
    write(SKEY, subs);
  }
  function delSub(pid, sid){
    if(!subs[todayKey] || !subs[todayKey][pid]) return;
    subs[todayKey][pid] = subs[todayKey][pid].filter(function(s){ return s.id !== sid; });
    write(SKEY, subs);
    setDone(sid, false);
  }

  function isSkipped(id){ return !!(skip[todayKey] && skip[todayKey][id]); }
  function setSkip(id, v){
    if(!skip[todayKey]) skip[todayKey] = {};
    if (v) skip[todayKey][id] = 1; else delete skip[todayKey][id];
    write(PKEY, skip);
    if (v) setDone(id, false);
  }

  function routineOf(bid){ return routine[bid] || []; }
  function addRoutine(bid, title){
    title = (title||"").trim(); if(!title) return;
    if(!routine[bid]) routine[bid] = [];
    routine[bid].push({ id:"r"+Date.now(), title:title, icon:"🌿", rt:bid });
    write(RKEY, routine);
  }
  function delRoutine(bid, id){
    routine[bid] = routineOf(bid).filter(function(t){ return t.id !== id; });
    write(RKEY, routine);
    setDone(id, false);
  }

  function customToday(){ return custom[todayKey] || []; }
  function addTask(title){
    title = (title||"").trim(); if(!title) return;
    if(!custom[todayKey]) custom[todayKey] = [];
    custom[todayKey].push({ id:"c"+Date.now(), title:title, icon:"📌", own:true });
    write(CKEY, custom);
  }
  function delTask(id){
    custom[todayKey] = customToday().filter(function(t){ return t.id !== id; });
    write(CKEY, custom);
    setDone(id, false);
    if (subs[todayKey]) { delete subs[todayKey][id]; write(SKEY, subs); }
  }

  /* дело считается сделанным: если есть подзадачи — когда все они отмечены */
  function itemDone(dk, id){
    var list = subsOf(dk, id);
    if (list.length) return list.every(function(s){ return done(dk, s.id); });
    return done(dk, id);
  }

  var data = null;
  var app = document.getElementById("app");

  fetch("data.json?v=" + Date.now(), {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(json){ data = json; loadAll(); render(); })
    .catch(function(){ stub(); });

  function stub(){
    app.classList.remove("skeleton");
    app.innerHTML =
      '<div class="stub"><h2>Список дел не загрузился</h2>' +
      '<p>Файл data.json лежит не рядом с index.html или в нём ошибка. Положи оба файла в одну папку и обнови.</p>' +
      '<button type="button" id="retry">Обновить</button></div>';
    document.getElementById("retry").onclick = function(){ location.reload(); };
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function forToday(items){
    return (items||[]).filter(function(i){
      return !i.days || i.days.indexOf(today.getDay()) !== -1;
    });
  }
  function blockItems(b){
    var items = forToday(b.items);
    if (b.addMode === "routine") items = items.concat(routineOf(b.id));
    else if (b.canAdd) items = items.concat(customToday());
    return items.filter(function(i){ return !isSkipped(i.id); });
  }
  function skippedOf(b){
    var all = forToday(b.items);
    if (b.addMode === "routine") all = all.concat(routineOf(b.id));
    else if (b.canAdd) all = all.concat(customToday());
    return all.filter(function(i){ return isSkipped(i.id); });
  }
  function allTodayIds(){
    var ids = [];
    data.blocks.forEach(function(b){ blockItems(b).forEach(function(i){ ids.push(i.id); }); });
    return ids;
  }
  function todayScheduled(){
    return (data.scheduled||[]).filter(function(s){
      return (s.weekdays||[]).indexOf(today.getDay()) !== -1;
    });
  }
  function monthCount(id){
    var n = 0, p = todayKey.slice(0,7);
    for (var k in state){ if(k.indexOf(p) === 0 && state[k][id]) n++; }
    return n;
  }
  function greeting(){
    var h = today.getHours();
    if (h < 11) return "Доброе утро";
    if (h < 17) return "Добрый день";
    if (h < 23) return "Добрый вечер";
    return "Доброй ночи";
  }

  function subsHTML(pid){
    var list = subsOf(todayKey, pid);
    var html = '<div class="subs">';
    list.forEach(function(s){
      var d = done(todayKey, s.id);
      html += '<div class="sub' + (d ? " done" : "") + '" data-sub="' + esc(s.id) + '">' +
                '<div class="sbox"></div>' +
                '<div class="sub-title">' + esc(s.title) + '</div>' +
                '<div class="del" data-delsub="' + esc(s.id) + '" data-parent="' + esc(pid) + '">×</div>' +
              '</div>';
    });
    html += (addingFor === pid
      ? '<div class="addform"><input id="newsub" type="text" placeholder="Что именно сделать?" maxlength="80">' +
        '<button type="button" id="subok">Готово</button></div>'
      : '<div class="subadd" data-addsub="' + esc(pid) + '"><span class="plus">+</span>Добавить пункт</div>');
    return html + '</div>';
  }

  function rowHTML(item, opts){
    opts = opts || {};
    var list = subsOf(todayKey, item.id);
    var d = itemDone(todayKey, item.id);
    var isOpen = !!open[item.id];
    var html = '<div class="row' + (d ? " done" : "") + (isOpen ? " open" : "") + '" data-id="' + esc(item.id) + '"' +
                 (opts.expandable ? ' data-exp="1"' : "") + ' role="button" tabindex="0">' +
                 '<div class="icon">' + esc(item.icon || "•") + '</div>' +
                 '<div class="row-text">' +
                   '<div class="row-title">' + esc(item.title) + '</div>' +
                   (item.note ? '<div class="row-note">' + esc(item.note) + '</div>' : "") +
                 '</div>' +
                 (list.length ? '<div class="subcount">' + list.filter(function(s){ return done(todayKey, s.id); }).length + '/' + list.length + '</div>' : "") +
                 (opts.extra || "") +
                 (item.own ? '<div class="del" data-del="' + esc(item.id) + '">×</div>' : "") +
                 (item.rt ? '<div class="del" data-delrt="' + esc(item.id) + '" data-block="' + esc(item.rt) + '">×</div>' : "") +
                 (opts.skippable && !item.own && !item.rt ? '<div class="del" data-skip="' + esc(item.id) + '">×</div>' : "") +
                 (opts.expandable ? '<div class="chev">›</div>' : "") +
                 '<div class="box" data-check="' + esc(item.id) + '"></div>' +
               '</div>';
    if (opts.expandable && isOpen) html += subsHTML(item.id);
    return html;
  }

  function render(){
    var ids = allTodayIds();
    var doneCount = ids.filter(function(id){ return itemDone(todayKey, id); }).length;
    var total = ids.length;
    var pct = total ? doneCount/total : 0;
    var C = 2 * Math.PI * 25;

    var user = data.user || {};
    var avatar = user.photo ? '<img src="' + esc(user.photo) + '" alt="">' : esc((user.name || "?").charAt(0));
    var dateStr = today.toLocaleDateString("ru-RU", {weekday:"long", day:"numeric", month:"long"});

    var html =
      '<div class="head">' +
        '<div class="avatar">' + avatar + '</div>' +
        '<div class="head-text">' +
          '<div class="head-hi">' + greeting() + '</div>' +
          '<div class="head-name">' + esc(user.name || "Мой ритм") + '</div>' +
          '<div class="head-date">' + esc(dateStr) + '</div>' +
        '</div>' +
        '<div class="ring"><svg width="58" height="58">' +
          '<circle class="ring-track" cx="29" cy="29" r="25" fill="none" stroke-width="5"/>' +
          '<circle class="ring-fill" cx="29" cy="29" r="25" fill="none" stroke-width="5" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C*(1-pct)) + '"/>' +
        '</svg><div class="ring-num">' + doneCount + '/' + total + '</div></div>' +
      '</div>';

    var ph = data.phrases || [];
    if (ph.length){
      var seed = Math.floor((today - new Date(today.getFullYear(),0,0)) / 86400000);
      var pi = data.phraseImage;
      html += '<div class="phrase' + (pi ? " pic" : "") + '"' +
              (pi ? ' style="background-image:url(\'' + pi + '\')"' : "") + '>' +
              '<span>' + esc(ph[seed % ph.length]) + '</span></div>';
    }

    html += '<div class="week">';
    for (var i = 6; i >= 0; i--){
      var dd = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      var k = key(dd);
      var dn = ids.filter(function(id){ return itemDone(k, id); }).length;
      var fill = total ? Math.round(dn/total*100) : 0;
      var shown = dn ? Math.max(fill, 25) : 0;
      var cls = dn === total && total ? " full" : (dn ? " filled" : "");
      html += '<div class="day' + (k === todayKey ? " today" : "") + '">' +
                '<div class="day-label">' + WD[dd.getDay()] + '</div>' +
                '<div class="dot' + cls + '" style="--fill:' + shown + '%">' + dd.getDate() + '</div>' +
              '</div>';
    }
    html += '</div>';

    data.blocks.forEach(function(b){
      var items = blockItems(b);
      var dn = items.filter(function(i){ return itemDone(todayKey, i.id); }).length;
      var full = items.length && dn === items.length;
      var w = items.length ? Math.round(dn/items.length*100) : 0;
      html += '<div class="block' + (full ? " done" : "") + '">' +
                '<div class="block-head">' +
                  '<div class="block-title">' +
                    (b.icon ? '<span class="block-icon">' + esc(b.icon) + '</span>' : "") + esc(b.title) +
                    (b.time ? '<span class="block-time">' + esc(b.time) + '</span>' : "") +
                  '</div>' +
                  '<div class="block-count' + (full ? " note" : "") + '">' +
                    (items.length ? (full ? esc(b.done || "готово") : dn + ' из ' + items.length) : "") +
                  '</div>' +
                '</div>' +
                (items.length ? '<div class="bar"><i style="width:' + w + '%"></i></div>' : "") +
                (items.length
                  ? items.map(function(it){ return rowHTML(it, {expandable: !!b.expandable, skippable: !!b.canSkip}); }).join("")
                  : '<div class="block-empty">' + esc(b.empty || "Свободно") + '</div>') +
                (function(){
                  var sk = skippedOf(b);
                  if (!sk.length) return "";
                  return '<div class="skipped">Пропущено сегодня: ' +
                    sk.map(function(i){
                      return '<span class="chip" data-unskip="' + esc(i.id) + '">' + esc(i.title) + ' ↩</span>';
                    }).join("") + '</div>';
                })() +
                (b.canAdd
                  ? (addingFor === "__" + b.id
                      ? '<div class="addform main"><input id="newtask" type="text" placeholder="' +
                        esc(b.addMode === "routine" ? "Новое дело" : "Новое дело на сегодня") + '" maxlength="80">' +
                        '<button type="button" id="taskok">Готово</button></div>'
                      : '<div class="add" data-addblock="' + esc(b.id) + '"><div class="icon">+</div>' +
                        "Добавить дело" + '</div>')
                  : "") +
              '</div>';
    });

    var sched = todayScheduled();
    if (sched.length){
      html += '<div class="block"><div class="block-head">' +
              '<div class="block-title"><span class="block-icon">📅</span>По расписанию</div></div>';
      sched.forEach(function(s){
        html += rowHTML(s, {extra: '<div class="badge">' + monthCount(s.id) + ' из ' + (s.monthlyGoal||1) + '</div>'});
      });
      html += '</div>';
    }

    html += '<div class="foot' + (doneCount === total && total ? " full" : "") + '">' +
            (doneCount === total && total ? "День закрыт полностью" : "Отмечай, что уже сделано") + '</div>';

    app.className = "";
    app.innerHTML = html;
    bind();
  }

  function on(sel, fn){
    Array.prototype.forEach.call(app.querySelectorAll(sel), function(el){
      el.addEventListener("click", function(e){ e.stopPropagation(); tap(); fn(el, e); });
    });
  }

  function bind(){
    /* строка: раскрыть или отметить */
    Array.prototype.forEach.call(app.querySelectorAll(".row"), function(row){
      var id = row.getAttribute("data-id");
      var exp = row.getAttribute("data-exp");
      function act(){
        tap();
        if (exp){ open[id] = !open[id]; if(!open[id] && addingFor === id) addingFor = ""; }
        else toggle(id);
        render();
      }
      row.addEventListener("click", act);
      row.addEventListener("keydown", function(e){
        if (e.key === " " || e.key === "Enter"){ e.preventDefault(); act(); }
      });
    });

    /* кружок: отметить, не раскрывая */
    on("[data-check]", function(el){
      var id = el.getAttribute("data-check");
      var list = subsOf(todayKey, id);
      if (list.length){
        var all = list.every(function(s){ return done(todayKey, s.id); });
        list.forEach(function(s){ setDone(s.id, !all); });
      } else toggle(id);
      render();
    });

    on("[data-sub]", function(el){ toggle(el.getAttribute("data-sub")); render(); });
    on("[data-delsub]", function(el){ delSub(el.getAttribute("data-parent"), el.getAttribute("data-delsub")); render(); });
    on("[data-del]", function(el){ delTask(el.getAttribute("data-del")); render(); });
    on("[data-delrt]", function(el){ delRoutine(el.getAttribute("data-block"), el.getAttribute("data-delrt")); render(); });
    on("[data-addsub]", function(el){ addingFor = el.getAttribute("data-addsub"); render(); });
    on("[data-addblock]", function(el){ addingFor = "__" + el.getAttribute("data-addblock"); render(); });
    on("[data-skip]", function(el){ setSkip(el.getAttribute("data-skip"), true); render(); });
    on("[data-unskip]", function(el){ setSkip(el.getAttribute("data-unskip"), false); render(); });

    setupInput("newsub", "subok", function(v){ addSub(addingFor, v); });
    setupInput("newtask", "taskok", function(v){
      var bid = addingFor.slice(2);
      var b = data.blocks.filter(function(x){ return x.id === bid; })[0];
      if (b && b.addMode === "routine") addRoutine(bid, v); else addTask(v);
    });
  }

  function setupInput(inputId, okId, save){
    var input = document.getElementById(inputId);
    if (!input) return;
    input.focus();
    var ok = function(){ save(input.value); addingFor = ""; render(); };
    var btn = document.getElementById(okId);
    if (btn) btn.addEventListener("click", ok);
    input.addEventListener("click", function(e){ e.stopPropagation(); });
    input.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); ok(); }
      if (e.key === "Escape"){ addingFor = ""; render(); }
    });
  }
})();
</script>
</body>
</html>
